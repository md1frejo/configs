set -g mouse on
set -g history-limit 9999
set -g base-index 1
set-option -g default-shell /usr/bin/fish
setw -g pane-base-index 1
setw -g mode-keys vi

set-option -g set-clipboard on

# =====================================
# Navigation
# =====================================

# Required for vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

bind -n C-h select-pane -L
bind -n C-k select-pane -U
# C-l intentionally not bound
# bind -n C-l select-pane -R

bind -n C-Space select-pane -t :.+
bind -n M-Space select-pane -t :.-

unbind C-b

set-option -g prefix C-x
bind C-x send-prefix

# =====================================
# Mouse paste
# =====================================

bind -n MouseDown2Pane run \
  "tmux set-buffer -b primary_selection \"$(xsel -o)\"; \
   tmux paste-buffer -b primary_selection; \
   tmux delete-buffer -b primary_selection"

# =====================================
# Copy mode
# =====================================

bind v copy-mode

bind-key -T copy-mode-vi v \
  send-keys -X begin-selection

bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel \
  "xclip -selection clipboard -in"

# =====================================
# Custom Light — matching Neovim theme
# =====================================

# Base
set -g status-style "fg=#1a1a1a,bg=#e6e6e6"

# Pane borders
set -g pane-border-style "fg=#c0c0c0"
set -g pane-active-border-style "fg=#004b8d"

# Messages
set -g message-style "fg=#000000,bg=#ffd60a,bold"
set -g message-command-style "fg=#ffffff,bg=#ff3b30,bold"

# Copy mode / selection
set -g mode-style "fg=#000000,bg=#c7e0ff,bold"

# Window tabs
setw -g window-status-style \
  "fg=#666666,bg=#f0f0f0"

setw -g window-status-current-style \
  "fg=#ffffff,bg=#004b8d,bold"

setw -g window-status-activity-style \
  "fg=#b00020,bg=#f0f0f0,bold"

# =====================================
# Status bar
# =====================================

set -g status-left-length 40
set -g status-right-length 80

set -g status-left \
  "#[fg=#ffffff,bg=#004b8d,bold] #S #[default] "

set -g status-right \
  "#[fg=#4a4a4a,bg=#e6e6e6] %Y-%m-%d #[fg=#4c1d95,bold] %H:%M "

setw -g window-status-format \
  "#[fg=#666666,bg=#f0f0f0] #I:#W "

setw -g window-status-current-format \
  "#[fg=#ffffff,bg=#004b8d,bold] #I:#W "

# =====================================
# TPM — must be last
# =====================================

