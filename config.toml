theme = "ashokai"

[editor]
clipboard-provider = "wayland"
end-of-line-diagnostics="hint"
soft-wrap.enable = true
line-number = "relative"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[keys.insert]
F1=":w"
F2="rotate_view"
"S-F5"="global_search"
F6="undo"

[keys.normal]
F1=":w"
F2="rotate_view"
F3=":buffer-close"
F4="select_all"
F5="search"
"S-F5"="global_search"
F6="undo"
"F8"="command_palette"
"C-y" = "yank_to_clipboard"
"C-p" = "replace_selections_with_clipboard"
"ä"="search"

tab=":buffer-next"
"S-tab"="buffer_picker"

"A-c"=":open ~/.config/helix/config.toml"
"A-p"=":open ~/Dropbox/prog"
"A-v"=":open ~/Dropbox/prog/web"
"A-m"=":open ~/Dropbox/documents/various"

[keys.normal."C-x"]
"2" = ":vsplit"
"3" = ":hsplit"
"o" = ":bn"
"s" = ":w"

[keys.select]
"C-y" = "yank_to_clipboard"
"C-p" = "paste_primary_clipboard_after"
